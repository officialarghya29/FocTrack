<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" role="img" aria-label="FocTrack session state machine">
  <rect width="1120" height="480" fill="#0C0F12"/>
  <text x="48" y="54" fill="#F0F3F5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">Session lifecycle</text>
  <text x="48" y="78" fill="#9BA7B1" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2.4">EVERY TRANSITION IS VALIDATED SERVER-SIDE</text>

  <!-- states -->
  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <rect x="70" y="140" width="180" height="76" rx="8" fill="#14191E" stroke="#262E35"/>
    <text x="160" y="172" fill="#F0F3F5" font-size="14" font-weight="600" text-anchor="middle">No session</text>
    <text x="160" y="192" fill="#7E8A94" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">idle</text>

    <rect x="330" y="140" width="180" height="76" rx="8" fill="#17201A" stroke="#B7F36B" stroke-opacity="0.5"/>
    <text x="420" y="172" fill="#F0F3F5" font-size="14" font-weight="600" text-anchor="middle">ACTIVE</text>
    <text x="420" y="192" fill="#B7F36B" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">clock advancing</text>

    <rect x="590" y="140" width="180" height="76" rx="8" fill="#1F1A14" stroke="#F3B65D" stroke-opacity="0.45"/>
    <text x="680" y="172" fill="#F0F3F5" font-size="14" font-weight="600" text-anchor="middle">PAUSED</text>
    <text x="680" y="192" fill="#F3B65D" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">clock frozen</text>

    <rect x="850" y="64" width="180" height="76" rx="8" fill="#14191E" stroke="#262E35"/>
    <text x="940" y="96" fill="#F0F3F5" font-size="14" font-weight="600" text-anchor="middle">COMPLETED</text>
    <text x="940" y="116" fill="#7FD1A6" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">counts in analytics</text>

    <rect x="850" y="216" width="180" height="76" rx="8" fill="#14191E" stroke="#262E35"/>
    <text x="940" y="248" fill="#F0F3F5" font-size="14" font-weight="600" text-anchor="middle">CANCELLED</text>
    <text x="940" y="268" fill="#9BA7B1" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">consistency only</text>
  </g>

  <!-- transitions -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0l8 4.5L0 9z" fill="#4A555E"/>
    </marker>
  </defs>

  <g stroke="#4A555E" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="250" y1="178" x2="322" y2="178"/>
    <line x1="510" y1="178" x2="582" y2="178"/>
    <path d="M620 140 C610 92 660 92 700 128"/>
    <path d="M770 128 C820 96 860 100 880 108" stroke-dasharray="0"/>
    <path d="M600 178 C700 200 760 240 842 248"/>
    <path d="M460 216 C470 292 560 330 640 330"/>
  </g>

  <g font-family="JetBrains Mono, monospace" font-size="9" fill="#9BA7B1">
    <text x="286" y="168" text-anchor="middle">start</text>
    <text x="546" y="168" text-anchor="middle">pause</text>
    <text x="664" y="106" text-anchor="middle">resume</text>
    <text x="806" y="102" text-anchor="middle">finish / target</text>
    <text x="716" y="238" text-anchor="middle">cancel</text>
    <text x="520" y="322" text-anchor="middle">interruption logged → focused time freezes</text>
  </g>

  <!-- interruption loop -->
  <g>
    <rect x="300" y="330" width="360" height="106" rx="8" fill="#14191E" stroke="#262E35"/>
    <text x="322" y="356" fill="#F07878" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="2">INTERRUPTION LOOP</text>
    <text x="322" y="380" fill="#C6CFD6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12">Reason + timestamp recorded.</text>
    <text x="322" y="400" fill="#C6CFD6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12">Session keeps running; interrupted seconds</text>
    <text x="322" y="418" fill="#C6CFD6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12">are excluded from focused time.</text>
  </g>

  <g font-family="JetBrains Mono, monospace" font-size="9.5" fill="#66727C">
    <text x="70" y="392">State survives refresh:</text>
    <text x="70" y="410">GET /sessions/active</text>
    <text x="70" y="428">reconciles the open session.</text>
  </g>
</svg>
