# Render blueprint for the FocTrack API.
# The service runs on the free plan, so the filesystem is ephemeral and the
# data lives in an external PostgreSQL database (Neon free tier).
services:
  - type: web
    name: foctrack-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FOCTRACK_ENVIRONMENT
        value: production
      # Set in the Render dashboard: the PostgreSQL DSN from the database host.
      - key: FOCTRACK_DATABASE_URL
        sync: false
      # Set after the frontend is deployed, then redeploy the API.
      - key: FOCTRACK_CORS_ORIGINS
        sync: false
