<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380" role="img" aria-label="How FocTrack calculates time">
  <rect width="1100" height="380" fill="#0C0F12"/>
  <text x="48" y="52" fill="#F0F3F5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">Time model</text>
  <text x="48" y="76" fill="#9BA7B1" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2.4">WALL CLOCK IN · DERIVED DURATIONS OUT</text>

  <!-- timeline: 60 → 980 -->
  <g font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="0.6">
    <rect x="60" y="180" width="220" height="40" fill="#B7F36B" fill-opacity="0.85"/>
    <text x="170" y="205" fill="#0B0F0C" text-anchor="middle">FOCUSED</text>

    <rect x="280" y="180" width="80" height="40" fill="#F07878" fill-opacity="0.8"/>
    <text x="320" y="205" fill="#1A0B0B" text-anchor="middle">INTERRUPT</text>

    <rect x="360" y="180" width="130" height="40" fill="#B7F36B" fill-opacity="0.85"/>
    <text x="425" y="205" fill="#0B0F0C" text-anchor="middle">FOCUSED</text>

    <rect x="490" y="180" width="90" height="40" fill="#1A2026" stroke="#3A444C" stroke-dasharray="4 3"/>
    <text x="535" y="205" fill="#9BA7B1" text-anchor="middle">PAUSED</text>

    <rect x="580" y="180" width="180" height="40" fill="#B7F36B" fill-opacity="0.85"/>
    <text x="670" y="205" fill="#0B0F0C" text-anchor="middle">FOCUSED</text>

    <rect x="760" y="180" width="60" height="40" fill="#F07878" fill-opacity="0.8"/>
    <text x="790" y="205" fill="#1A0B0B" text-anchor="middle">INT.</text>

    <rect x="820" y="180" width="160" height="40" fill="#B7F36B" fill-opacity="0.85"/>
    <text x="900" y="205" fill="#0B0F0C" text-anchor="middle">FOCUSED</text>
  </g>

  <line x1="60" y1="240" x2="980" y2="240" stroke="#2A333A"/>
  <g font-family="JetBrains Mono, monospace" font-size="9" fill="#66727C">
    <text x="60" y="262">t0 · start</text>
    <text x="980" y="262" text-anchor="end">t1 · now / close</text>
  </g>

  <g font-family="JetBrains Mono, monospace" font-size="10.5" fill="#9BA7B1">
    <rect x="60" y="300" width="300" height="56" rx="6" fill="#14191E" stroke="#262E35"/>
    <text x="76" y="322" fill="#F0F3F5" font-size="10">focused = active − interrupted</text>
    <text x="76" y="342" fill="#7E8A94" font-size="9">paused intervals never enter either term</text>

    <rect x="376" y="300" width="310" height="56" rx="6" fill="#14191E" stroke="#262E35"/>
    <text x="392" y="322" fill="#F0F3F5" font-size="10">wall = close − start (includes pauses)</text>
    <text x="392" y="342" fill="#7E8A94" font-size="9">shown for context, never used as focus</text>

    <rect x="702" y="300" width="338" height="56" rx="6" fill="#14191E" stroke="#262E35"/>
    <text x="718" y="322" fill="#F0F3F5" font-size="10">stored in UTC · bucketed locally</text>
    <text x="718" y="342" fill="#7E8A94" font-size="9">day boundaries follow tzOffsetMinutes</text>
  </g>
</svg>
