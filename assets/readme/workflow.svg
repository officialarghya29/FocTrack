<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img" aria-label="FocTrack session state machine">
  <rect width="1120" height="520" fill="#0C0F12"/>
  <text x="48" y="54" fill="#F0F3F5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">Session lifecycle</text>
  <text x="48" y="78" fill="#9BA7B1" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2.4">EVERY TRANSITION IS VALIDATED SERVER-SIDE</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0l8 4.5L0 9z" fill="#4A555E"/>
    </marker>
  </defs>

  <!-- states -->
  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <rect x="48" y="120" width="170" height="76" rx="8" fill="#14191E" stroke="#262E35"/>
    <text x="133" y="152" fill="#F0F3F5" font-size="14" font-weight="600" text-anchor="middle">No session</text>
    <text x="133" y="172" fill="#7E8A94" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">idle</text>

    <rect x="290" y="120" width="180" height="76" rx="8" fill="#17201A" stroke="#B7F36B" stroke-opacity="0.5"/>
    <text x="380" y="152" fill="#F0F3F5" font-size="14" font-weight="600" text-anchor="middle">ACTIVE</text>
    <text x="380" y="172" fill="#B7F36B" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">clock advancing</text>

    <rect x="550" y="120" width="180" height="76" rx="8" fill="#1F1A14" stroke="#F3B65D" stroke-opacity="0.45"/>
    <text x="640" y="152" fill="#F0F3F5" font-size="14" font-weight="600" text-anchor="middle">PAUSED</text>
    <text x="640" y="172" fill="#F3B65D" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">clock frozen</text>

    <rect x="550" y="310" width="180" height="76" rx="8" fill="#14191E" stroke="#262E35"/>
    <text x="640" y="342" fill="#F0F3F5" font-size="14" font-weight="600" text-anchor="middle">COMPLETED</text>
    <text x="640" y="362" fill="#7FD1A6" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">counts in analytics</text>

    <rect x="820" y="310" width="180" height="76" rx="8" fill="#14191E" stroke="#262E35"/>
    <text x="910" y="342" fill="#F0F3F5" font-size="14" font-weight="600" text-anchor="middle">CANCELLED</text>
    <text x="910" y="362" fill="#9BA7B1" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">consistency only</text>
  </g>

  <!-- start / pause -->
  <g stroke="#4A555E" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="218" y1="158" x2="282" y2="158"/>
    <line x1="470" y1="158" x2="542" y2="158"/>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="9" fill="#9BA7B1" text-anchor="middle">
    <text x="250" y="148">start</text>
    <text x="506" y="148">pause</text>
  </g>

  <!-- resume arc above the row -->
  <path d="M640 120 C640 76 380 76 380 120" stroke="#4A555E" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <text x="510" y="88" fill="#9BA7B1" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">resume</text>

  <!-- close bus -->
  <g stroke="#3E4850" stroke-width="1.3" fill="none">
    <path d="M380 196 V246"/>
    <path d="M640 196 V246"/>
    <path d="M380 246 H910"/>
  </g>
  <g stroke="#3E4850" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M640 246 V302"/>
    <path d="M910 246 V302"/>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="9" fill="#9BA7B1">
    <text x="652" y="268">complete</text>
    <text x="922" y="268">cancel</text>
    <text x="392" y="238">either open state can close</text>
  </g>

  <!-- interruption branch -->
  <path d="M300 196 V330" stroke="#F07878" stroke-opacity="0.5" stroke-width="1.3" stroke-dasharray="4 4" fill="none"/>
  <text x="312" y="272" fill="#9BA7B1" font-family="JetBrains Mono, monospace" font-size="9">log interruption</text>

  <g>
    <rect x="48" y="330" width="420" height="120" rx="8" fill="#14191E" stroke="#262E35"/>
    <text x="72" y="358" fill="#F07878" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="2">INTERRUPTION TRACKING</text>
    <text x="72" y="384" fill="#C6CFD6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12">Reason, notes and timestamps are stored. The session</text>
    <text x="72" y="404" fill="#C6CFD6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12">keeps running; interrupted seconds are subtracted</text>
    <text x="72" y="424" fill="#C6CFD6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12">from focused time.</text>
  </g>

  <text x="580" y="432" fill="#66727C" font-family="JetBrains Mono, monospace" font-size="9.5">State survives a refresh: GET /sessions/active</text>
  <text x="580" y="452" fill="#66727C" font-family="JetBrains Mono, monospace" font-size="9.5">reconciles the open session with the database.</text>
  <text x="580" y="482" fill="#66727C" font-family="JetBrains Mono, monospace" font-size="9.5">Cancelled sessions are retained for consistency</text>
  <text x="580" y="502" fill="#66727C" font-family="JetBrains Mono, monospace" font-size="9.5">and excluded from focus totals.</text>
</svg>
