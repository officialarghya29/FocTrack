<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="FocTrack — measure your focus, master your time">
  <defs>
    <radialGradient id="glow" cx="78%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#B7F36B" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#B7F36B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F0F3F5" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="#0C0F12"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <g transform="translate(72 88)">
    <circle cx="34" cy="34" r="33" fill="none" stroke="#39434B" stroke-width="2"/>
    <path d="M34 1a33 33 0 0 1 33 33" fill="none" stroke="#F0F3F5" stroke-width="3" stroke-linecap="round"/>
    <path d="M34 67A33 33 0 0 1 1 34" fill="none" stroke="#B7F36B" stroke-width="5" stroke-linecap="round"/>
    <circle cx="34" cy="34" r="16" fill="none" stroke="#5D6972" stroke-width="1.5"/>
    <path d="M34 34V10" stroke="#B7F36B" stroke-width="4" stroke-linecap="round"/>
    <path d="M34 34l15 9" stroke="#F0F3F5" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="34" cy="34" r="4.5" fill="#B7F36B"/>
  </g>

  <text x="172" y="116" fill="#F0F3F5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="54" font-weight="600" letter-spacing="-1.8">Foc<tspan fill="#B7F36B">Track</tspan></text>
  <text x="174" y="150" fill="#9BA7B1" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="3.6">MEASURE YOUR FOCUS. MASTER YOUR TIME.</text>

  <text x="173" y="203" fill="#C6CFD6" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15">A focus tracker that separates time spent from focused time.</text>
  <text x="173" y="227" fill="#7E8A94" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">Interruption accounting, an explainable score, and analytics from real records.</text>

  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" letter-spacing="1.8">
    <rect x="173" y="262" width="150" height="30" rx="15" fill="none" stroke="#2A333A"/>
    <text x="248" y="281" fill="#9BA7B1" text-anchor="middle">REACT + FASTAPI</text>
    <rect x="335" y="262" width="118" height="30" rx="15" fill="none" stroke="#2A333A"/>
    <text x="394" y="281" fill="#9BA7B1" text-anchor="middle">LOCAL-FIRST</text>
    <rect x="465" y="262" width="168" height="30" rx="15" fill="none" stroke="#2A333A"/>
    <text x="549" y="281" fill="#9BA7B1" text-anchor="middle">TIMESTAMP-BASED</text>
  </g>

  <g transform="translate(1000 200)">
    <circle r="152" fill="none" stroke="#1D242A" stroke-width="1"/>
    <g stroke="#39434B" stroke-width="1.5">
      <line x1="0" y1="-143" x2="0" y2="-132"/>
      <line x1="101" y1="-101" x2="93" y2="-93"/>
      <line x1="143" y1="0" x2="132" y2="0"/>
      <line x1="101" y1="101" x2="93" y2="93"/>
      <line x1="0" y1="143" x2="0" y2="132"/>
      <line x1="-101" y1="101" x2="-93" y2="93"/>
      <line x1="-143" y1="0" x2="-132" y2="0"/>
      <line x1="-101" y1="-101" x2="-93" y2="-93"/>
    </g>
    <circle r="116" fill="none" stroke="#1D242A" stroke-width="1"/>
    <circle r="116" fill="none" stroke="#B7F36B" stroke-width="3" stroke-linecap="round"
            stroke-dasharray="486 729" transform="rotate(-90)"/>
    <text y="-4" fill="#F0F3F5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="40" text-anchor="middle">01:12:40</text>
    <text y="26" fill="#B7F36B" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" letter-spacing="3" text-anchor="middle">IN FOCUS</text>
    <line x1="-40" y1="52" x2="40" y2="52" stroke="#2A333A" stroke-width="1"/>
    <text y="74" fill="#7E8A94" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.5" letter-spacing="2" text-anchor="middle">SESSION LIVE</text>
  </g>
</svg>
