name: Keep the free API warm

# The Render free web service stops after 15 minutes without traffic and takes
# tens of seconds to start again. This schedule keeps a request flowing so the
# first visitor of the day gets an instant response instead of a spinner.
#
# Render grants 750 free instance-hours per month. One always-on service uses
# about 744, so this stays inside the free plan. Scheduled workflows in public
# repositories do not consume paid Actions minutes.

on:
  schedule:
    # Every five minutes, with margin under the 15 minute idle timeout.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the API and confirm the database
        run: |
          curl --silent --show-error --fail \
            --max-time 90 \
            --retry 4 --retry-delay 10 --retry-all-errors \
            https://foctrack-api.onrender.com/api/v1/health
