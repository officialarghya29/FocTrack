name: Keep the free API warm

# The Render free web service stops after 15 minutes without traffic and takes
# tens of seconds to start again. This schedule is a best-effort optimisation:
# GitHub delays scheduled runs and disables them after long repository
# inactivity. An external pinger (UptimeRobot or cron-job.org) is the reliable
# option; see docs/deployment.md.
#
# Render grants 750 free instance-hours per month. One always-on service uses
# about 744, so this stays inside the free plan. Scheduled workflows in public
# repositories do not consume paid Actions minutes.

on:
  schedule:
    # Every five minutes, with margin under the 15 minute idle timeout.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the API and confirm the database
        run: |
          # /health/ready also wakes the Neon compute, so the first real user
          # request does not pay for both cold starts.
          curl --silent --show-error --fail \
            --max-time 120 \
            --retry 4 --retry-delay 10 --retry-all-errors \
            https://foctrack-api.onrender.com/api/v1/health/ready
