# Render blueprint for the FocTrack API.
# The service runs on the free plan, so the filesystem is ephemeral and the
# data lives in an external PostgreSQL database (Neon free tier).
services:
  - type: web
    name: foctrack-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: FOCTRACK_ENVIRONMENT
        value: production
      # Set in the Render dashboard: the PostgreSQL DSN from the database host.
      - key: FOCTRACK_DATABASE_URL
        sync: false
      # Set after the frontend is deployed, then redeploy the API.
      - key: FOCTRACK_CORS_ORIGINS
        sync: false
      # Required: at least 32 characters. The API refuses to boot without it.
      - key: FOCTRACK_JWT_SECRET
        sync: false
      # Required for Google sign-in; leave unset to keep password-only auth.
      - key: FOCTRACK_GOOGLE_CLIENT_ID
        sync: false
      # Render terminates TLS and forwards the real client address.
      - key: FOCTRACK_TRUST_FORWARDED_FOR
        value: "true"
