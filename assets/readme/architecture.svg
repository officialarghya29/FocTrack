<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="FocTrack architecture">
  <rect width="1200" height="620" fill="#0C0F12"/>
  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="48" y="56" fill="#F0F3F5" font-size="22" font-weight="600">System architecture</text>
    <text x="48" y="80" fill="#9BA7B1" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2.4">BROWSER → HTTP/JSON → API → ORM → SQLITE</text>
  </g>

  <!-- Frontend -->
  <g>
    <rect x="48" y="112" width="288" height="300" rx="8" fill="#14191E" stroke="#262E35"/>
    <text x="72" y="144" fill="#62DCEB" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2.4">PRESENTATION</text>
    <text x="72" y="172" fill="#F0F3F5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">React + Vite frontend</text>

    <g font-family="JetBrains Mono, monospace" font-size="10.5" fill="#9BA7B1">
      <rect x="72" y="196" width="240" height="34" rx="5" fill="#1A2026" stroke="#2A333A"/>
      <text x="86" y="217">Routes · Dashboard / Focus / History</text>
      <rect x="72" y="238" width="240" height="34" rx="5" fill="#1A2026" stroke="#2A333A"/>
      <text x="86" y="259">TanStack Query · server state</text>
      <rect x="72" y="280" width="240" height="34" rx="5" fill="#1A2026" stroke="#2A333A"/>
      <text x="86" y="301">Timer derived from timestamps</text>
      <rect x="72" y="322" width="240" height="34" rx="5" fill="#1A2026" stroke="#2A333A"/>
      <text x="86" y="343">Recharts · Lucide · Tailwind</text>
    </g>
    <text x="72" y="386" fill="#66727C" font-family="JetBrains Mono, monospace" font-size="9.5">No analytics are computed client-side.</text>
  </g>

  <!-- Arrow -->
  <g stroke="#3A444C" stroke-width="1.5">
    <line x1="336" y1="262" x2="412" y2="262"/>
    <path d="M404 257l9 5-9 5" fill="#3A444C" stroke="none"/>
  </g>
  <text x="374" y="250" fill="#9BA7B1" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">JSON</text>
  <text x="374" y="282" fill="#66727C" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">/api/v1</text>

  <!-- Backend -->
  <g>
    <rect x="421" y="112" width="326" height="440" rx="8" fill="#14191E" stroke="#262E35"/>
    <text x="445" y="144" fill="#B7F36B" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2.4">APPLICATION</text>
    <text x="445" y="172" fill="#F0F3F5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">FastAPI backend</text>

    <g font-family="JetBrains Mono, monospace" font-size="10.5" fill="#9BA7B1">
      <rect x="445" y="196" width="278" height="58" rx="5" fill="#1A2026" stroke="#2A333A"/>
      <text x="459" y="217">API layer · routers, validation,</text>
      <text x="459" y="235">status codes, ownership checks</text>

      <rect x="445" y="264" width="278" height="76" rx="5" fill="#1A2026" stroke="#2A333A"/>
      <text x="459" y="285">Services · session lifecycle,</text>
      <text x="459" y="303">pause/resume reconciliation,</text>
      <text x="459" y="321">interruption bookkeeping</text>

      <rect x="445" y="350" width="278" height="58" rx="5" fill="#1A2026" stroke="#262E35"/>
      <rect x="445" y="350" width="4" height="58" rx="2" fill="#A78BFA"/>
      <text x="459" y="371">Analytics · daily/weekly/monthly</text>
      <text x="459" y="389">aggregation + focus score</text>

      <rect x="445" y="418" width="278" height="58" rx="5" fill="#1A2026" stroke="#2A333A"/>
      <text x="459" y="439">Repositories · SQLAlchemy 2.0</text>
      <text x="459" y="457">queries scoped by user_id</text>
    </g>
    <text x="445" y="506" fill="#66727C" font-family="JetBrains Mono, monospace" font-size="9.5">Pydantic schemas · camelCase on the wire</text>
    <text x="445" y="524" fill="#66727C" font-family="JetBrains Mono, monospace" font-size="9.5">UTC in storage · local timezone at the edges</text>
  </g>

  <!-- Arrow -->
  <g stroke="#3A444C" stroke-width="1.5">
    <line x1="747" y1="262" x2="823" y2="262"/>
    <path d="M815 257l9 5-9 5" fill="#3A444C" stroke="none"/>
  </g>
  <text x="785" y="250" fill="#9BA7B1" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">SQL</text>

  <!-- Database -->
  <g>
    <rect x="832" y="112" width="320" height="300" rx="8" fill="#14191E" stroke="#262E35"/>
    <text x="856" y="144" fill="#F3B65D" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2.4">PERSISTENCE</text>
    <text x="856" y="172" fill="#F0F3F5" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">SQLite → PostgreSQL</text>

    <g font-family="JetBrains Mono, monospace" font-size="10.5" fill="#9BA7B1">
      <rect x="856" y="196" width="272" height="30" rx="4" fill="#1A2026" stroke="#2A333A"/>
      <text x="870" y="216">users</text>
      <rect x="856" y="232" width="272" height="30" rx="4" fill="#1A2026" stroke="#2A333A"/>
      <text x="870" y="252">categories</text>
      <rect x="856" y="268" width="272" height="30" rx="4" fill="#1A2026" stroke="#2A333A"/>
      <text x="870" y="288">focus_sessions</text>
      <rect x="856" y="304" width="272" height="30" rx="4" fill="#1A2026" stroke="#2A333A"/>
      <text x="870" y="324">interruptions</text>
      <rect x="856" y="340" width="272" height="30" rx="4" fill="#1A2026" stroke="#2A333A"/>
      <text x="870" y="360">user_settings</text>
    </g>
    <text x="856" y="392" fill="#66727C" font-family="JetBrains Mono, monospace" font-size="9.5">Unique partial index: one open session per user</text>
  </g>

  <!-- Tooling row -->
  <g font-family="JetBrains Mono, monospace" font-size="10" fill="#9BA7B1">
    <rect x="48" y="462" width="288" height="90" rx="8" fill="#0F1418" stroke="#262E35" stroke-dasharray="4 4"/>
    <text x="68" y="488" fill="#62DCEB" font-size="9" letter-spacing="2">TESTS</text>
    <text x="68" y="510">Pytest · HTTPX · TestClient</text>
    <text x="68" y="529">Vitest · Testing Library · jsdom</text>

    <rect x="832" y="432" width="320" height="52" rx="8" fill="#0F1418" stroke="#262E35" stroke-dasharray="4 4"/>
    <text x="852" y="454" fill="#A78BFA" font-size="9" letter-spacing="2">MIGRATIONS</text>
    <text x="852" y="472">Alembic upgrade head on startup</text>

    <rect x="832" y="500" width="320" height="52" rx="8" fill="#0F1418" stroke="#262E35" stroke-dasharray="4 4"/>
    <text x="852" y="522" fill="#B7F36B" font-size="9" letter-spacing="2">DEPLOY</text>
    <text x="852" y="540">Vercel (static) · Render (API + disk)</text>
  </g>
</svg>
