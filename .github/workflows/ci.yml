name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOCTRACK_ENVIRONMENT: test
      FOCTRACK_JWT_SECRET: ci-only-secret-that-is-long-enough-for-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Audit dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Test
        working-directory: backend
        run: python -m pytest -q

  postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foctrack
          POSTGRES_PASSWORD: foctrack
          POSTGRES_DB: foctrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foctrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FOCTRACK_ENVIRONMENT: test
      FOCTRACK_JWT_SECRET: ci-only-secret-that-is-long-enough-for-validation
      FOCTRACK_DATABASE_URL: postgresql+psycopg://foctrack:foctrack@localhost:5432/foctrack_test
      FOCTRACK_TEST_DATABASE_URL: postgresql+psycopg://foctrack:foctrack@localhost:5432/foctrack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Test against PostgreSQL
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
